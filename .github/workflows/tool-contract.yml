name: tool-contract

on:
  pull_request:
    paths:
      - "plugins/mcp-server/skills/**"
      - "plugins/mcp-server/skills/tool-names.json"
      - ".github/workflows/tool-contract.yml"
      - "scripts/check_tool_contract.py"
      - "scripts/test_tool_contract.py"

jobs:
  tool-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python3 scripts/test_tool_contract.py -v

      - name: Tool-name contract check
        run: python3 scripts/check_tool_contract.py
